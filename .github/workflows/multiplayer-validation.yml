name: CraftEduc multiplayer validation

on:
  push:
    branches:
      - feature/crafteduc-multiplayer
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Physics regression tests
        run: |
          pnpm exec tsc tests/physics-mass.test.ts --outDir .test-dist --module commonjs --moduleResolution node --target ES2022 --esModuleInterop --noEmit false --incremental false --skipLibCheck
          node .test-dist/tests/physics-mass.test.js
      - name: Proximity sensor condition regression
        run: |
          pnpm exec tsc tests/proximity-sensor.test.ts --outDir .test-dist --module commonjs --moduleResolution node --target ES2022 --esModuleInterop --noEmit false --incremental false --skipLibCheck
          node .test-dist/tests/proximity-sensor.test.js
      - name: Multi-motor physics regression
        run: |
          pnpm exec tsc tests/multi-motor.test.ts --outDir .test-dist --module commonjs --moduleResolution node --target ES2022 --esModuleInterop --noEmit false --incremental false --skipLibCheck
          node .test-dist/tests/multi-motor.test.js
      - name: Production build
        run: pnpm build
