name: Temporary physics mass and hotbar build check

on:
  push:
    branches:
      - physics/rapier-check

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run physics mass and collision regression tests
        run: |
          pnpm exec tsc --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir .test-build tests/physics-mass.test.ts
          node .test-build/tests/physics-mass.test.js
          rm -rf .test-build
      - name: Build application
        run: pnpm build
