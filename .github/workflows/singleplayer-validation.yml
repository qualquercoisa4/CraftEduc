name: CraftEduc single-player build validation

on:
  push:
    branches:
      - work/servo-and-color-preservation
      - feature/laboratory-test-world
      - refactor/singleplayer-infrastructure
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Regression suite and production build
        run: pnpm build
